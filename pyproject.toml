[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrec"
version = "0.1.0"
description = "Deterministic, reproducible autonomous shopping-agent experiments"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0", "openai==2.48.0"]

[project.scripts]
agentrec = "agentrec.cli:main"

[tool.setuptools.packages.find]
include = ["agentrec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
